name: Release

# Pushing a tag like v0.3.0 runs CI on it, builds romi for x86_64 and aarch64 Linux, and makes a
# draft release with both, ready for notes before it's published.

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          # The oldest Ubuntu runners there are, so the binaries run on any glibc since 2.35.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="romi-$GITHUB_REF_NAME-${{ matrix.arch }}-linux"
          mkdir -p "$name/completions" "$name/examples"
          cp target/release/romi LICENSE CREDITS.md README.md default-config.jsonc "$name/"
          cp packaging/completions/* "$name/completions/"
          cp -r examples/couch "$name/examples/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: romi-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Make a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum romi-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "romi $GITHUB_REF_NAME" --generate-notes romi-*.tar.gz SHA256SUMS
