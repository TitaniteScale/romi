[package]
name = "romi"
version = "0.2.0"
edition = "2024"
description = "A terminal game launcher for ROMs, native ports and Steam, driven by keyboard or controller"
license = "MIT"
repository = "https://github.com/TitaniteScale/romi"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
crc32fast = "1.5.3"
dirs = "7.0.0"
flate2 = "1"
fuzzy-matcher = "0.3.7"
gilrs = "0.11.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
json_comments = "0.2.2"
libc = "0.2.191"
libloading = "0.8"
md5 = "0.7"
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
roxmltree = "0.21.1"
rtrb = "0.4"
rustix = { version = "1.1.5", features = ["event", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
ureq = "3.5.0"

# Run the importer's tests with the rest.
[[example]]
name = "wireframe-import"
path = "examples/wireframe-import/main.rs"
test = true

[build-dependencies]
cc = "1.10.0"
